# BuildingBudgetExtender configuration
# Place this file next to the plugin DLL:
# Fallout 4\Data\F4SE\Plugins\BuildingBudgetExtender.ini
#
# When Mod Configuration Menu (MCM) is installed, MCM settings take precedence
# after the game loads. Use MCM for in-game changes; edit this file for manual setup.
# BudgetIncreaseFactor: multiplier applied to each settlement's original budget when extending (default 1.5)
BudgetIncreaseFactor=1.5
#
# Fallback limits for workshops that report invalid (<= 0) defaults (custom settlements)
DefaultMaxDrawsFallback=100000
DefaultMaxTrianglesFallback=100000
#
# Extend when usage reaches this fraction of the current max (0.95 = at 95%, before the vanilla limit message)
ExtendThreshold=0.95
#
# Cap each settlement at originalDefault × this value (e.g. 10 = up to 10× vanilla). 0 = unlimited.
MaxBudgetMultiplier=0
#
# Show on-screen notifications (legacy key — sets both extend and cap notifications)
ShowNotification=true
#
# Show on-screen notification when the budget is extended
ShowExtendNotification=true
#
# Show on-screen notification when a capped settlement reaches its max budget
ShowCapNotification=true
#
# Write details to the F4SE log file
VerboseLogging=true
